spring.application.name=demo

# Puerto: en tu PC 8080; en un hosting (Railway/Render) el servidor define PORT
server.port=${PORT:8080}

spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=demo

# ---- Roles ----
# Administrador inicial (opcional): ver Config/AdminInicial.java
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
# Clave para firmar los tokens de sesion. Si no se define, se genera una al azar en cada arranque.
app.token.secret=${TOKEN_SECRET:}
